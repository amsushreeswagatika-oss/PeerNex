
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="512" height="512" rx="100" fill="#000000"/>

  <!-- Graduation cap -->
  <path d="M95 135 L180 95 L265 135 L180 175 Z"
        fill="url(#purple)"/>
  <path d="M130 153 V195 Q180 225 230 195 V153"
        fill="none" stroke="#ffffff" stroke-width="9"/>
  <path d="M265 135 V185"
        stroke="#facc15" stroke-width="7"/>
  <circle cx="265" cy="190" r="9" fill="#facc15"/>

  <!-- Two connected students -->
  <circle cx="205" cy="230" r="29" fill="#ffffff"/>
  <circle cx="310" cy="230" r="29" fill="url(#purple)"/>

  <path d="M160 335 Q160 275 205 270 Q250 275 250 335 Z"
        fill="#ffffff"/>
  <path d="M265 335 Q265 275 310 270 Q355 275 355 335 Z"
        fill="url(#blue)"/>

  <!-- Open book -->
  <path d="M170 350 Q220 325 256 365 Q292 325 342 350
           L342 400 Q292 375 256 415 Q220 375 170 400 Z"
        fill="#ffffff"/>

  <path d="M256 365 V415"
        stroke="#4f46e5" stroke-width="6"/>

  <!-- Growth arrow -->
  <path d="M350 345 L390 300 L415 320 L455 255"
        fill="none" stroke="#facc15"
        stroke-width="13" stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M430 255 L455 255 L455 280"
        fill="none" stroke="#facc15"
        stroke-width="13" stroke-linecap="round"/>

  <!-- Earnings coin -->
  <circle cx="410" cy="165" r="38"
          fill="#facc15" stroke="#f59e0b" stroke-width="7"/>
  <text x="410" y="179"
        text-anchor="middle"
        font-size="40"
        font-weight="bold"
        fill="#111827">₹</text>

  <!-- Brand name -->
  <text x="256" y="465"
        text-anchor="middle"
        font-size="48"
        font-weight="bold"
        fill="white">PeerNex</text>

</svg>
