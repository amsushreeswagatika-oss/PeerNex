```
<div class="section-title">

    <p>PEERNEX PAYMENT</p>

    <h2>💳 Student-Friendly Payment</h2>

    <p>
        Simple and transparent pricing for student services.
    </p>

<div class="request-form">

    <label>Service</label>

    <input
        type="text"
        id="service"
        value="Graphic Design"
    >


    <label>Student / Service Provider</label>

    <input
        type="text"
        id="provider"
        value="Ananya Sharma"
    >


    <label>Amount</label>

    <input
        type="number"
        id="amount"
        value="200"
        min="1"
    >


    <label>Payment Method</label>

    <select id="paymentMethod">

        <option>UPI</option>

        <option>
            Debit / Credit Card
        </option>

        <option>
            Student Wallet
        </option>

    </select>


    <div
        style="
            margin-top:20px;
            padding:18px;
            background:#f8f9ff;
            border-radius:12px;
        "
    >

        <strong>Total Amount</strong>

        <h2
            id="totalAmount"
            style="
                margin-top:8px;
                color:#4f46e5;
            "
        >
            ₹200
        </h2>

    </div>


    <button
        class="find-match-btn"
        onclick="makePayment()"
    >
        💳 Pay Now
    </button>

</div>

</footer>

<script>

// Update displayed amount

const amountInput =
    document.getElementById("amount");

const totalAmount =
    document.getElementById("totalAmount");


amountInput.addEventListener(
    "input",
    function () {

        const amount =
            amountInput.value || 0;

        totalAmount.textContent =
            "₹" + amount;

    }
);


// Save payment

function makePayment() {

    const service =
        document.getElementById("service").value;

    const provider =
        document.getElementById("provider").value;

    const amount =
        document.getElementById("amount").value;

    const method =
        document.getElementById("paymentMethod").value;


    // Validation

    if (
        service.trim() === "" ||
        provider.trim() === "" ||
        amount === "" ||
        Number(amount) <= 0
    ) {

        alert(
            "Please enter valid payment details."
        );

        return;

    }


    // Get existing payments

    let payments =
        JSON.parse(
            localStorage.getItem("peerNexPayments")
        ) || [];


    // Create payment record

    const payment = {

        service: service,

        provider: provider,

        amount: Number(amount),

        method: method,

        status: "Completed",

        date: new Date().toLocaleDateString("en-IN"),

        time: new Date().toLocaleTimeString("en-IN")

    };


    // Add new payment

    payments.push(payment);


    // Save payments

    localStorage.setItem(
        "peerNexPayments",
        JSON.stringify(payments)
    );


    // Success message

    alert(

        "✅ Demo Payment Successful!\n\n" +

        "Service: " + service + "\n" +

        "Provider: " + provider + "\n" +

        "Amount: ₹" + amount + "\n" +

        "Method: " + method + "\n" +

        "Status: Completed\n\n" +

        "💳 Payment saved to your PeerNex history!"

    );


    // Open activity page

    window.location.href =
        "history.html";

}

</script>
